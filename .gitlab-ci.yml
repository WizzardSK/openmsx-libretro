# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)
#
# This recipe is consumed by the Libretro buildbot so the openMSX core can be
# distributed through RetroArch's Online Updater > Core Downloader.
#
# Linux x64/aarch64, Windows x64, macOS arm64/x86_64 and Android arm64-v8a. openMSX builds with
# its own make (build/main.mk, LIBRETRO=true) against static libraries it
# builds first (make 3rdparty: SDL3 and SDL3_ttf with CMake, Tcl, FreeType, GLEW, libpng, zlib), and
# it is C++23. That rules out the buildbot's own Linux images and the MXE
# toolchain names openMSX's build does not know, so the Linux and Windows jobs
# run on Ubuntu and pull their own compiler, as the project's GitHub CI
# (.github/workflows/libretro.yml) does. The data the core reads from
# <system>/openmsx (machines, extensions, C-BIOS) is not part of the core.

# The Linux and Windows jobs fetch their compiler from Ubuntu's archive, and
# a connection to it that drops (security.ubuntu.com, pipeline 133736) failed
# the job with nothing wrong in the recipe: apt retries each download, and a
# failed job runs again before the pipeline gives up on it.
default:
  retry: 2

# Core definitions
.core-defs:
  variables:
    CORENAME: openmsx

# Overriding before_script drops the template's NUMPROC, hence the re-export.
.core-deps-linux:
  image: ubuntu:22.04
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - '[ "$NUMPROC" -ge 1 ] || NUMPROC=1'
    - apt-get -o Acquire::Retries=5 update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -yqq --no-install-recommends
        software-properties-common gpg-agent ca-certificates git make cmake gcc libc6-dev python3 pkg-config
        libopengl-dev libegl-dev libgl-dev
    - add-apt-repository -y ppa:ubuntu-toolchain-r/test
    - apt-get -o Acquire::Retries=5 update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -yqq --no-install-recommends gcc-13 g++-13
  variables:
    # glibc 2.35, GCC 13 with its libstdc++ linked into the core
    CC: gcc-13
    CXX: g++-13
    LIBRETRO: "true"
  script:
    - make 3rdparty OPENMSX_TARGET_CPU=${OPENMSX_CPU} OPENMSX_TARGET_OS=linux
        OPENMSX_FLAVOUR=opt PYTHON=python3 -j${NUMPROC}
    - make OPENMSX_TARGET_CPU=${OPENMSX_CPU} OPENMSX_TARGET_OS=linux
        OPENMSX_FLAVOUR=opt 3RDPARTY_FLAG=true PYTHON=python3 -j${NUMPROC}
    - mv derived/${OPENMSX_CPU}-linux-opt-3rd/lib/${CORENAME}_libretro.so ${CORENAME}_libretro.so

include:
  ################################## DESKTOP ##################################
  # Linux
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-x64.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-aarch64.yml'

  # Windows
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-x64-mingw.yml'

  # macOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-arm64.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-x64.yml'

  ################################## CELLULAR #################################
  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-jni.yml'

# Stages for building
stages:
  - build-prepare
  - build-shared
  - build-static

##############################################################################
#################################### STAGES ##################################
##############################################################################
#
################################### DESKTOP ##################################
# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-x64
    - .core-deps-linux
    - .core-defs
  variables:
    OPENMSX_CPU: x86_64
  after_script:
    - strip --strip-unneeded ${CORENAME}_libretro.so

# Linux aarch64
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-aarch64
    - .core-deps-linux
    - .core-defs
  variables:
    OPENMSX_CPU: aarch64
  after_script:
    - strip --strip-unneeded ${CORENAME}_libretro.so

# Windows 64-bit, cross-built with MinGW (POSIX threads), as openMSX's own
# Windows build is
libretro-build-windows-x64:
  extends:
    - .libretro-windows-x64-mingw
    - .core-defs
  image: ubuntu:24.04
  variables:
    LIBRETRO: "true"
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - '[ "$NUMPROC" -ge 1 ] || NUMPROC=1'
    - apt-get -o Acquire::Retries=5 update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -yqq --no-install-recommends
        ca-certificates git make cmake gcc libc6-dev python3 tcl mingw-w64
    - update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
    - update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
  script:
    - make 3rdparty OPENMSX_TARGET_CPU=x86_64 OPENMSX_TARGET_OS=mingw-w64
        OPENMSX_FLAVOUR=opt PYTHON=python3 -j${NUMPROC}
    - make OPENMSX_TARGET_CPU=x86_64 OPENMSX_TARGET_OS=mingw-w64
        OPENMSX_FLAVOUR=opt 3RDPARTY_FLAG=true PYTHON=python3 -j${NUMPROC}
    - mv derived/x86_64-mingw-w64-opt-3rd/lib/${CORENAME}_libretro.dll ${CORENAME}_libretro.dll
    - x86_64-w64-mingw32-strip --strip-unneeded ${CORENAME}_libretro.dll

# macOS: Apple clang and openMSX's own deployment target (13.3, for the
# C++23 library it uses; build/platform-darwin.mk)
.core-osx:
  extends: .core-defs
  variables:
    LIBRETRO: "true"
    MACOSX_DEPLOYMENT_TARGET: "13.3"
  script:
    - make 3rdparty OPENMSX_TARGET_CPU=${OPENMSX_CPU} OPENMSX_TARGET_OS=darwin
        OPENMSX_FLAVOUR=opt PYTHON=python3 -j${NUMPROC}
    - make OPENMSX_TARGET_CPU=${OPENMSX_CPU} OPENMSX_TARGET_OS=darwin
        OPENMSX_FLAVOUR=opt 3RDPARTY_FLAG=true PYTHON=python3 -j${NUMPROC}
    - mv derived/${OPENMSX_CPU}-darwin-opt-3rd/lib/${CORENAME}_libretro.dylib ${CORENAME}_libretro.dylib
    - strip -x ${CORENAME}_libretro.dylib
    - lipo -info ${CORENAME}_libretro.dylib

# macOS 64-bit (ARM)
libretro-build-osx-arm64:
  extends:
    - .libretro-osx-arm64
    - .core-osx
  variables:
    OPENMSX_CPU: aarch64

# macOS 64-bit (Intel): built on the Apple Silicon runner for x86_64 (the
# 3rdparty packages configured with --host), as the Intel runner's Xcode
# has no C++23 (-std=c++2b)
libretro-build-osx-x64:
  extends:
    - .libretro-osx-arm64
    - .core-osx
  variables:
    OPENMSX_CPU: x86_64

################################### CELLULAR #################################
# Android: openMSX's own make with the NDK's clang (API 24), not ndk-build, as
# the project's GitHub CI builds it; the core draws with its software output
# there (no desktop GL core context on Android). NDK 29.0 of the image, for
# C++23; where it is missing (the GitHub preflight) the NDK NDK_ROOT names.
.core-android:
  extends: .core-defs
  variables:
    LIBRETRO: "true"
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - '[ "$NUMPROC" -ge 1 ] || NUMPROC=1'
    - if ! command -v tclsh >/dev/null || ! command -v pkg-config >/dev/null || ! command -v cmake >/dev/null; then
        apt-get -o Acquire::Retries=5 update -qq && DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -yqq --no-install-recommends tcl pkg-config make cmake python3;
      fi
    - if [ -d "${ANDROID_HOME}/ndk/29.0.14206865" ]; then export NDK_ROOT="${ANDROID_HOME}/ndk/29.0.14206865"; fi
    - export TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
    - export PATH="$TC/bin:$PATH"
    - export CC=${OPENMSX_TRIPLE}24-clang CXX=${OPENMSX_TRIPLE}24-clang++
    - export AR=$TC/bin/llvm-ar RANLIB=$TC/bin/llvm-ranlib STRIP=$TC/bin/llvm-strip
  script:
    - make 3rdparty OPENMSX_TARGET_CPU=${OPENMSX_CPU} OPENMSX_TARGET_OS=android
        OPENMSX_FLAVOUR=opt PYTHON=python3 -j${NUMPROC}
    - make OPENMSX_TARGET_CPU=${OPENMSX_CPU} OPENMSX_TARGET_OS=android
        OPENMSX_FLAVOUR=opt OPENMSX_STRIP=false 3RDPARTY_FLAG=true PYTHON=python3 -j${NUMPROC}
    - mv derived/${OPENMSX_CPU}-android-opt-3rd/lib/${CORENAME}_libretro*.so ${CORENAME}_libretro_android.so
    - $STRIP --strip-unneeded ${CORENAME}_libretro_android.so

# Android ARMv8a
android-arm64-v8a:
  extends:
    - .libretro-android-jni-arm64-v8a
    - .core-android
  variables:
    OPENMSX_CPU: aarch64
    OPENMSX_TRIPLE: aarch64-linux-android
